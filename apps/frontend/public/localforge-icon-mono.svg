<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="monoTitle monoDesc">
  <title id="monoTitle">LocalForge Monochrome</title>
  <desc id="monoDesc">LocalForge single-color icon for flexible usage</desc>
  
  <defs>
    <style>
      .lf-mono { fill: currentColor; }
    </style>
  </defs>
  
  <!-- Anvil symbol - pure monochrome, inherits color from parent element -->
  <g transform="translate(24, 24)">
    <!-- Anvil body - bold geometric shape -->
    <path d="M-14 -10 L14 -10 L16 -6 L16 6 L-16 6 L-16 -6 Z" class="lf-mono"/>
    
    <!-- Anvil base -->
    <rect x="-13" y="7" width="26" height="5" rx="2" class="lf-mono" opacity="0.85"/>
    
    <!-- Hammer head -->
    <rect x="-7" y="-16" width="14" height="4" rx="1.5" class="lf-mono" opacity="0.75"/>
    
    <!-- Hammer handle -->
    <rect x="-1.5" y="-16" width="3" height="9" rx="1" class="lf-mono" opacity="0.75"/>
  </g>
  
  <!-- Outer rounded square border (optional, for button treatment) -->
  <rect x="2" y="2" width="44" height="44" rx="10" ry="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
</svg>
