<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="iconDarkTitle iconDarkDesc">
  <title id="iconDarkTitle">LocalForge Icon Dark</title>
  <desc id="iconDarkDesc">LocalForge brand mark for dark backgrounds</desc>
  
  <defs>
    <style>
      .lf-dark-bg { fill: #FFFFFF; }
      .lf-dark-accent { fill: #66B3FF; }
      .lf-dark-accent-strong { fill: #4A9EFF; }
      .lf-dark-surface { fill: #1E293B; }
    </style>
  </defs>
  
  <!-- Background rounded square - white for contrast -->
  <rect x="0" y="0" width="48" height="48" rx="12" ry="12" class="lf-dark-bg"/>
  
  <!-- Anvil symbol - simplified for clarity -->
  <g transform="translate(24, 24)">
    <!-- Anvil body -->
    <path d="M-13 -9 L13 -9 L15 -5 L15 5 L-15 5 L-15 -5 Z" class="lf-dark-accent" opacity="0.9"/>
    
    <!-- Anvil base -->
    <rect x="-12" y="6" width="24" height="5" rx="2" class="lf-dark-accent-strong" opacity="0.85"/>
    
    <!-- Hammer above -->
    <rect x="-6" y="-15" width="12" height="4" rx="1.5" class="lf-dark-surface" opacity="0.8"/>
    <rect x="-1.5" y="-15" width="3" height="7" rx="1" class="lf-dark-surface" opacity="0.8"/>
  </g>
  
  <!-- Accent ring -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#dark-ring)" stroke-width="2" opacity="0.3"/>
  
  <defs>
    <linearGradient id="dark-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66B3FF"/>
      <stop offset="100%" stop-color="#4A9EFF"/>
    </linearGradient>
  </defs>
</svg>
